    <style>
      html,body{background:#06070a;margin:0}
      #boot{position:fixed;inset:0;display:grid;place-items:center;transition:opacity .4s ease}
      #boot span{display:inline-block;width:6px;margin:0 3px;border-radius:3px;background:linear-gradient(#18e2b0,#8466ff);animation:b 1s ease-in-out infinite}
      #boot span:nth-child(1){height:14px;animation-delay:-.2s}#boot span:nth-child(2){height:24px;animation-delay:-.4s}#boot span:nth-child(3){height:32px;animation-delay:-.6s}#boot span:nth-child(4){height:24px;animation-delay:-.8s}#boot span:nth-child(5){height:14px}
      @keyframes b{50%{transform:scaleY(.45)}}
      @media (prefers-reduced-motion:reduce){#boot span{animation:none}}
    </style>
  </head>
  <body>
    <div id="root"><div id="boot" aria-label="Loading Wavee"><div><span></span><span></span><span></span><span></span><span></span></div></div></div>
    <noscript>Wavee needs JavaScript to play music.</noscript>
    <script type="module" src="/src/main.tsx"></script>
