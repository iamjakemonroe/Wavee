    <style>
      html,body{background:#06070a;margin:0}
      #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4.5vmin;transition:opacity .4s ease}
      #boot .t{width:22vmin;height:22vmin;border-radius:5.06vmin;background:radial-gradient(95% 95% at 25% 15%,#1b1f2a,#0a0b10);display:flex;align-items:center;justify-content:center;gap:1.045vmin}
      #boot .t i{display:block;width:1.43vmin;border-radius:1vmin;animation:b 1.1s ease-in-out infinite}
      #boot .t i:nth-child(1){height:4.95vmin;background:#18e2b0;animation-delay:-.2s}
      #boot .t i:nth-child(2){height:8.25vmin;background:#2fc7c4;animation-delay:-.4s}
      #boot .t i:nth-child(3){height:11vmin;background:#4eaad8;animation-delay:-.6s}
      #boot .t i:nth-child(4){height:8.8vmin;background:#6b8deb;animation-delay:-.8s}
      #boot .t i:nth-child(5){height:6.05vmin;background:#8466ff}
      #boot b{font:700 7.5vmin/1 "Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:-.02em;color:#eef1f5}
      @keyframes b{50%{transform:scaleY(.6)}}
      @media (prefers-reduced-motion:reduce){#boot .t i{animation:none}}
    </style>
